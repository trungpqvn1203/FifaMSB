services:
  postgres:
    image: postgres:16-alpine
    container_name: webfifa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-webfifa}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-webfifa}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: webfifa_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-webfifa}
      # .env dùng SESSION_SECRET_KEY, backend đọc là SECRET_KEY
      SECRET_KEY: ${SESSION_SECRET_KEY:-webfifa_super_secret_session_key_change_me}
      # Đọc từ .env: ENVIRONMENT=development hoặc production
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Đọc từ .env: CORS_ORIGINS=[...]
      ALLOWED_ORIGINS: ${CORS_ORIGINS:-["http://localhost","http://localhost:80"]}
      # Đọc từ .env: CLOCK_MODE=real
      CLOCK_MODE: ${CLOCK_MODE:-real}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: webfifa_frontend
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  postgres_data:
